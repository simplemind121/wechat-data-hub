server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    access_log off;
    client_max_body_size 1024m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
