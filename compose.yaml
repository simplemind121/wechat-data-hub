name: wechat-data-hub
x-api: &api
  build: {context: ., dockerfile: infra/api.Dockerfile}
  image: wechat-data-hub-api:0.1.0
  environment:
    DATABASE_URL: ${DATABASE_URL:?Run make bootstrap first}
    DATA_ROOT: /var/lib/wechat-hub
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp:mode=1777,size=64m]
  mem_limit: 512m
  cpus: 1.0

services:
  db:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wechat_hub}
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make bootstrap first}
    volumes: [postgres:/var/lib/postgresql/data]
    restart: unless-stopped
    shm_size: 128m
    mem_limit: 1g
    cpus: 1.0
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *api
    command: [alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
  api:
    <<: *api
    ports: ["127.0.0.1:${APP_PORT:-8000}:8000"]
    volumes: [archive:/var/lib/wechat-hub]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
  web:
    build: {context: ., dockerfile: infra/web.Dockerfile}
    image: wechat-data-hub-web:0.1.0
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:mode=1777,size=32m]
    ports: ["127.0.0.1:${WEB_PORT:-5173}:8080"]
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres:
  archive:
