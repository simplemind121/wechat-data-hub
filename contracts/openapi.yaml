openapi: 3.1.0
info:
  title: WeChat Data Hub API
  version: 1.0.0-draft
  description: >
    Contract seed; implementation MUST expand request/response schemas, error cases,
    workspace scope and security contract tests before release. No external WeChat API.
servers:
  - url: http://127.0.0.1:8000/api/v1
security:
  - cookieAuth: []
paths:
  /health/live:
    get:
      security: []
      summary: Liveness (no private data)
      responses:
        '200': {description: Alive}
  /health/ready:
    get:
      security: []
      summary: Readiness (no secrets or private data)
      responses:
        '200': {description: Ready}
        '503': {description: Unready}
  /auth/login:
    post:
      security: []
      summary: Local login, rate-limited, establishes session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, format: password}
      responses:
        '200': {description: Authenticated}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {description: Rate limited}
  /auth/logout:
    post:
      summary: Revoke login session
      responses:
        '204': {description: Logged out}
  /me:
    get:
      summary: Current user and authorized workspaces
      responses:
        '200': {description: Identity and permissions}
  /imports:
    post:
      summary: Upload signed-off export files and manifest; admin only
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [manifest, payload]
              properties:
                manifest: {type: string, description: JSON manifest}
                payload: {type: string, format: binary}
      responses:
        '202':
          description: Created or reused a durable ingest job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '413': {description: Upload too large}
    get:
      summary: List import batches (admin or reviewer)
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: Paginated imports}
  /imports/{import_id}/coverage:
    get:
      summary: Coverage metrics for observable input only
      parameters:
        - {$ref: '#/components/parameters/ImportId'}
      responses:
        '200': {description: Typed completeness and error report}
        '404': {$ref: '#/components/responses/NotFound'}
  /imports/{import_id}/retry:
    post:
      summary: Retry failed stage without duplicating records; admin only
      parameters:
        - {$ref: '#/components/parameters/ImportId'}
      responses:
        '202': {description: Retry accepted}
        '409': {description: Not retryable}
  /conversations:
    get:
      summary: List authorized conversations
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: Conversation page}
  /conversations/{conversation_id}/messages:
    get:
      summary: Message timeline with source observation count
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: Paginated timeline}
        '404': {$ref: '#/components/responses/NotFound'}
  /messages/{message_id}:
    get:
      summary: Canonical message, revisions and provenance
      parameters:
        - name: message_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Canonical message}
        '404': {$ref: '#/components/responses/NotFound'}
  /contacts:
    get:
      summary: Contact and aliases list
      responses:
        '200': {description: Paginated contacts}
  /attachments/{attachment_id}/download:
    get:
      summary: Authorization-gated attachment stream; never expose CAS path
      parameters:
        - name: attachment_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Binary stream}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /search:
    get:
      summary: Keyword and filtered search; embeddings optional
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 1000}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: Source-linked results}
  /reviews/{review_id}/resolve:
    post:
      summary: Confirm/reject/defer a conflict; reviewer or admin
      parameters:
        - name: review_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: {type: string, enum: [merge, reject, defer]}
                reason: {type: string, minLength: 1}
      responses:
        '200': {description: Decision audited}
  /process/{kind}:
    post:
      summary: Start OCR/ASR/embedding/LLM processing if enabled
      parameters:
        - name: kind
          in: path
          required: true
          schema: {type: string, enum: [ocr, asr, embedding, llm]}
      responses:
        '202': {description: Job accepted}
        '422': {description: Module disabled or scope unauthorized}
  /jobs/{job_id}:
    get:
      summary: Durable job status
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Job state and progress}
  /entities:
    get:
      summary: Proposed and approved business entities
      responses:
        '200': {description: Paginated entity proposals}
  /entities/{entity_id}/approve:
    post:
      summary: Approve evidence-backed candidate
      parameters:
        - name: entity_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Approved with audit entry}
  /integrations/odoo/test:
    post:
      summary: CE instance model/credential capability handshake; admin only
      responses:
        '200': {description: Model permission report}
  /integrations/odoo/dry-run:
    post:
      summary: Explain diffs without remote writes
      responses:
        '200': {description: Dry-run report}
  /integrations/odoo/sync:
    post:
      summary: Explicit admin-approved draft writes only
      responses:
        '202': {description: Outbox jobs created}
  /audit:
    get:
      summary: Administrative audit log
      responses:
        '200': {description: Paginated events without raw message contents}
  /exports/messages:
    get:
      summary: Admin-only export of authorized canonical messages
      parameters:
        - name: format
          in: query
          required: true
          schema: {type: string, enum: [jsonl, csv]}
      responses:
        '200': {description: Export stream and audit event}
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: wdh_session
  parameters:
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
    ImportId:
      name: import_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    JobAccepted:
      type: object
      required: [job_id, status]
      properties:
        job_id: {type: string, format: uuid}
        status: {type: string, enum: [queued, running, completed]}
        import_id: {type: string, format: uuid}
    ApiError:
      type: object
      required: [code, message, request_id]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string}
        details: {type: object, additionalProperties: true}
  responses:
    Unauthorized: {description: Authentication required}
    Forbidden: {description: Not authorized for workspace or object}
    NotFound: {description: Not found or not visible}
    BadRequest: {description: Invalid source payload or manifest}
